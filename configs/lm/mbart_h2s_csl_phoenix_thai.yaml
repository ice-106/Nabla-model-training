target: mGPT.archs.mgpt_mbart.Mbart_Based_MLM
params:
  model_type: mbart_multi
  model_path: ./deps/mbart-h2s-csl-phoenix
  num_heads: 3
  stage: ${TRAIN.STAGE}
  motion_codebook_size: ${model.params.codebook_size}
  ablation: ${ABLATION}
  use_kws: ${oc.select:KWS.ENABLED,false}
  name2kws_path: ${oc.select:KWS.NAME2KWS_PATH,'scripts/name2kws_{split}.json'}  # quote default: OmegaConf 2.3 rejects unquoted '{' in an interpolation
  word2code_path: ${oc.select:KWS.WORD2CODE_PATH,scripts/word2code.json}
  debug_kws: ${oc.select:KWS.DEBUG,false}
  # Exact vocabulary used by four-language/Thai checkpoints (19,505 base rows).
  include_thai_source_token: true
  # [MODIFIED] Thai whole-word tokens. Default '' keeps every existing experiment byte-identical.
  thai_word_tokens_path: ${oc.select:THAI_WORDS.PATH,''}
  thai_word_init: ${oc.select:THAI_WORDS.INIT,dict}          # dict | shuffled | none
  thai_word_init_seed: ${oc.select:THAI_WORDS.SEED,0}        # only used by 'shuffled'
  map_ids_unk_warn_ratio: ${oc.select:THAI_WORDS.UNK_WARN_RATIO,0.05}
